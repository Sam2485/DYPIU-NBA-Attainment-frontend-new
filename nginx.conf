server {
    listen 3010;
    server_name _;

    root /var/www/dypiu-nba-frontend;
    index index.html;

    # Allow Excel and survey file uploads up to 25MB
    client_max_body_size 25M;

    # Gzip compression for production performance
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Single Page Application (SPA) Routing for React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets for performance
    location ~* \.(?:css|js|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # Optional proxy to backend on the same VM if accessing via single origin
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8010/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 25M;
    }

    error_page 500 502 503 504 /5x.html;
    location = /5x.html {
        root /var/www/dypiu-nba-frontend;
    }
}
